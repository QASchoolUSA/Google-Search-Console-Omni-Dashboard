name = "google-search-console-omni-dashboard"
main = "worker.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Static Assets (SolidJS built frontend)
[assets]
directory = "./dist"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "gscdata"
database_id = "1d6a4c10-494c-4484-a1fe-cba6fa970a48"

[vars]
ENVIRONMENT = "production"
