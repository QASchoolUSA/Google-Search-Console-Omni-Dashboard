name = "google-search-console-omni-dashboard"
main = "worker.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Static Assets (SolidJS built frontend)
[assets]
directory = "./dist"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "gsc-database"
database_id = "local-gsc-db-id"

[vars]
ENVIRONMENT = "production"
